name: Test and Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -q

      - name: Build bilingual pack
        run: uv run python src/build_pack.py

      - name: Verify pack
        run: uv run python src/verify.py
